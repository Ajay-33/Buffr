name: Build Buffr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Pinned Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Missing Secret::ANDROID_KEYSTORE_BASE64 is not set on this repository."
            echo "::error::Create it from your LOCAL debug keystore in PowerShell:"
            echo "::error::[Convert]::ToBase64String([IO.File]::ReadAllBytes(\"$env:USERPROFILE\\.android\\debug.keystore\"))"
            echo "::error::Then add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Decode the EXACT keystore bytes used locally -> same SHA-1 on every build
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore

      - name: Verify Pinned Certificate Fingerprints
        run: |
          KS=android/app/debug.keystore
          ALIAS=androiddebugkey
          echo "=========================================================="
          echo "🚀 BUFFR PINNED SIGNING FINGERPRINTS:"
          keytool -list -v -keystore $KS -alias $ALIAS -storepass android | grep -E "SHA1|SHA256|MD5"
          echo "=========================================================="

          # Hard-fail the build if the certificate is NOT the one registered in Firebase
          EXPECTED_SHA1="a1c32dad91274fc3649b4af205a3acec6f4d1cfd"
          ACTUAL_SHA1=$(keytool -list -v -keystore $KS -alias $ALIAS -storepass android \
            | grep "SHA1:" | head -n1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error title=Certificate Mismatch::Keystore SHA-1 ($ACTUAL_SHA1) does NOT match the Firebase-registered SHA-1 ($EXPECTED_SHA1)."
            echo "::error::Google Sign-In will fail with 'No credentials available'. Check the ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "✅ Keystore matches the SHA-1 registered in Firebase. Sign-In will work."

      - name: Install Node Dependencies
        run: |
          npm install --include=optional

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
          ./gradlew assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Buffr-v1.0-Beta.apk

      - name: Upload Buffr Build
        uses: actions/upload-artifact@v4
        with:
          name: Buffr-Beta-Build
          path: build-output/Buffr-v1.0-Beta.apk
