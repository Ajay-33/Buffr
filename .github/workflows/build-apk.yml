name: Build Buffr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write access to create Releases
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Committed Signing Keystore
        run: |
          KS=android/app/debug.keystore
          ALIAS=androiddebugkey
          echo "=========================================================="
          echo "🚀 BUFFR PINNED SIGNING FINGERPRINTS:"
          keytool -list -v -keystore $KS -alias $ALIAS -storepass android | grep -E "SHA1|SHA256|MD5"
          echo "=========================================================="

          # Hard-fail the build if the certificate is NOT the one registered in Firebase
          EXPECTED_SHA1="4cd97fe3b2f7892d47569a42ff7668d6e60b84b5"
          ACTUAL_SHA1=$(keytool -list -v -keystore $KS -alias $ALIAS -storepass android \
            | grep "SHA1:" | head -n1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error title=Certificate Mismatch::Keystore SHA-1 ($ACTUAL_SHA1) does NOT match the Firebase-registered SHA-1 ($EXPECTED_SHA1)."
            echo "::error::Google Sign-In will fail with 'No credentials available'. The committed android/app/debug.keystore was modified or replaced." 
            exit 1
          fi
          echo "✅ Keystore matches the SHA-1 registered in Firebase. Sign-In will work."

      - name: Install Node Dependencies
        run: |
          npm install --include=optional

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
          ./gradlew assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Buffr-v1.0-Beta.apk

      - name: Upload Buffr Build
        uses: actions/upload-artifact@v4
        with:
          name: Buffr-Beta-Build
          path: build-output/Buffr-v1.0-Beta.apk

      # ── PERMANENT LATEST RELEASE ────────────────────────────────
      # Release assets never expire (unlike 90-day artifacts) and the rolling
      # 'latest' tag is always re-pointed at the newest commit.
      - name: Remove Previous Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || echo "No previous latest release - creating fresh"

      - name: Publish Rolling Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            ⚡ Automatic build from commit ${{ github.sha }}
            🕒 Built: ${{ github.event.head_commit.timestamp }}

            📲 **Install:** download `Buffr-v1.0-Beta.apk` below, open it on your
            Android device and allow installs from unknown sources.
            ✍️ Signed with the pinned debug certificate registered in Firebase,
            so Google Sign-In works out of the box.
          draft: false
          prerelease: false
          make_latest: true
          files: build-output/Buffr-v1.0-Beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
