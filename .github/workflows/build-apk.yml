name: Build Buffr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Fixed Debug Keystore Exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating consistent debug keystore in android/app/debug.keystore..."
            keytool -genkey -v \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print Exact SHA-1 & SHA-256 Fingerprints
        run: |
          echo "=========================================================="
          echo "🚀 BUFFR FIXED DEBUG SIGNING FINGERPRINTS:"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256|MD5"
          echo "=========================================================="

      - name: Install Node Dependencies
        run: |
          npm install --include=optional

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
          ./gradlew assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Buffr-v1.0-Beta.apk

      - name: Upload Buffr Build
        uses: actions/upload-artifact@v4
        with:
          name: Buffr-Beta-Build
          path: build-output/Buffr-v1.0-Beta.apk
