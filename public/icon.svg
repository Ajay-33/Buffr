<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b38" />
      <stop offset="50%" stop-color="#0d061f" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full background with safe zone padding for Android adaptive icons -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Pixel Grid Overlay -->
  <path d="M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512" stroke="#3b1d6e" stroke-width="2" opacity="0.35" />

  <!-- Outer Arcade Border with Neon Accents -->
  <rect x="56" y="56" width="400" height="400" rx="36" fill="#120826" stroke="#4c1d95" stroke-width="8" />
  <rect x="68" y="68" width="376" height="376" rx="28" fill="none" stroke="#facc15" stroke-width="4" opacity="0.7" />

  <!-- Corner Pixel Bolts -->
  <rect x="76" y="76" width="16" height="16" fill="#06b6d4" />
  <rect x="420" y="76" width="16" height="16" fill="#ec4899" />
  <rect x="76" y="420" width="16" height="16" fill="#22c55e" />
  <rect x="420" y="420" width="16" height="16" fill="#facc15" />

  <!-- Arcade Game Controller / Shield Center Emblem -->
  <!-- Shield Backing -->
  <polygon points="256,110 370,165 370,285 256,380 142,285 142,165" fill="#1e103f" stroke="#06b6d4" stroke-width="6" />
  
  <!-- Arcade D-Pad -->
  <g transform="translate(180, 210)">
    <rect x="18" y="0" width="18" height="54" fill="#334155" rx="3" stroke="#000" stroke-width="2" />
    <rect x="0" y="18" width="54" height="18" fill="#334155" rx="3" stroke="#000" stroke-width="2" />
    <rect x="18" y="18" width="18" height="18" fill="#1e293b" />
    <!-- Dpad direction indicators -->
    <polygon points="27,4 21,12 33,12" fill="#94a3b8" />
    <polygon points="27,50 21,42 33,42" fill="#94a3b8" />
    <polygon points="4,27 12,21 12,33" fill="#94a3b8" />
    <polygon points="50,27 42,21 42,33" fill="#94a3b8" />
  </g>

  <!-- Arcade Action Buttons (A/B Diamond Layout) -->
  <circle cx="310" cy="220" r="14" fill="url(#neonPink)" stroke="#831843" stroke-width="3" filter="url(#glow)" />
  <circle cx="280" cy="245" r="14" fill="url(#neonCyan)" stroke="#155e75" stroke-width="3" filter="url(#glow)" />
  <circle cx="340" cy="245" r="14" fill="#22c55e" stroke="#14532d" stroke-width="3" filter="url(#glow)" />
  <circle cx="310" cy="270" r="14" fill="url(#neonGold)" stroke="#713f12" stroke-width="3" filter="url(#glow)" />

  <!-- Center Gaming Lightning / Level Up Star -->
  <polygon points="256,130 264,152 288,154 270,170 275,193 256,180 237,193 242,170 224,154 248,152" fill="url(#neonGold)" stroke="#000" stroke-width="2" filter="url(#glow)" />

  <!-- Level Banner / Brand Typography -->
  <rect x="120" y="325" width="272" height="42" rx="8" fill="#0f051d" stroke="#facc15" stroke-width="4" />
  <text x="256" y="354" font-family="'Press Start 2P', monospace, 'Courier New', sans-serif" font-size="22" font-weight="bold" fill="#facc15" text-anchor="middle" letter-spacing="2">BUFFR</text>

  <!-- Level 99 XP / Power Dots -->
  <circle cx="256" cy="395" r="6" fill="#06b6d4" />
  <circle cx="236" cy="395" r="4" fill="#facc15" />
  <circle cx="276" cy="395" r="4" fill="#ec4899" />
  <circle cx="218" cy="395" r="3" fill="#22c55e" />
  <circle cx="294" cy="395" r="3" fill="#a855f7" />
</svg>
